<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <title>فروشگاه آنلاین</title>
</head>

<body>


    <section class="container py-3">
        <div class="row g-4">

            <!-- کارت1 offset -->
            <div class=" col-md-4 offset-md-1">
                <div class="bg-primary text-center rounded shadow-lg  p-4 ">
                    <h2>کارت1</h2>
                    <p class="mb-0"> offset-md-1</p>
                </div>
            </div>

            <!-- کارت 2 که 7 ستون گرفته -->
            <div class=" col-md-7 ">
                <div class="bg-success text-center rounded shadow-lg  p-4 ">
                    <h2>کارت2</h2>
                    <p class="mb-0"> col-md-7</p>
                </div>
            </div>

            <!-- کارت های 3 و 4 کنار هم -->
            <div class=" col-md-6">
                <div class="bg-info text-center rounded shadow-lg  p-4 ">
                    <h2>کارت3</h2>
                    <p class="mb-0"> col-md-6</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="bg-danger text-center rounded shadow-lg  p-4 ">
                    <h2>کارت4</h2>
                    <p class="mb-0"> col-md-6</p>
                </div>
            </div>

            <!-- کارت 5 با ترتیب 2 -->
            <div class="col-md-4 order-md-2">
                <div class="bg-warning text-center rounded shadow-lg  p-4 ">
                    <h2>کارت5</h2>
                    <p class="mb-0"> order-md-2</p>
                </div>
            </div>

            <!-- کارت 6 با ترتیب 1 -->
            <div class="col-md-8 order-md-1">
                <div class="bg-secondary  text-center rounded shadow-lg  p-4 ">
                    <h2>کارت6</h2>
                    <p class="mb-0"> order-md-1</p>
                </div>
            </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
